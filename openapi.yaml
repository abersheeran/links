openapi: 3.1.0
info:
  title: Links API
  version: 0.2.0
  description: Multi-tenant short link service on Cloudflare Workers, D1, KV, Analytics Engine, and Workers AI.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{apiHost}
    description: Deployment-specific API hostname
    variables:
      apiHost:
        default: links.example.workers.dev
security:
  - tenantKey: []
  - sessionCookie: []
tags:
  - name: Admin
    description: Platform-level tenant provisioning.
  - name: Account
    description: Current tenant and API key identity.
  - name: Links
    description: Tenant-scoped short link management.
  - name: Auth
    description: Browser login, session, logout, and password management.
  - name: Users
    description: Tenant member and role management.
  - name: API Keys
    description: Tenant API key rotation and revocation.
  - name: Analytics
    description: Click analytics backed by Analytics Engine.
  - name: AI
    description: Workers AI link metadata suggestions with deterministic fallback.
  - name: Public
    description: Unauthenticated redirect and health endpoints.
paths:
  /api/v1/admin/tenants:
    post:
      operationId: provisionTenant
      tags: [Admin]
      summary: Provision a tenant and its first API key
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, hostname]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                slug:
                  type: string
                  pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
                  minLength: 3
                  maxLength: 40
                hostname:
                  type: string
                  example: links.example.com
                apiKeyName:
                  type: string
                  minLength: 1
                  maxLength: 80
                  default: Default key
                owner:
                  type: object
                  description: Optional first owner created atomically with the tenant.
                  required: [name, email, password]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 80
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      minLength: 12
                      maxLength: 128
      responses:
        '201':
          description: Tenant created. The API key token is only returned here.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [tenant, apiKey]
                    properties:
                      tenant:
                        $ref: '#/components/schemas/Tenant'
                      apiKey:
                        allOf:
                          - $ref: '#/components/schemas/ApiKeyCreated'
                          - type: object
                            required: [token]
                            properties:
                              token:
                                type: string
                                description: Returned once and never stored in plaintext.
                      owner:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: listTenants
      tags: [Admin]
      summary: List recently created tenants
      security:
        - platformToken: []
      responses:
        '200':
          description: Up to 100 most recently created tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/tenants/{tenantId}/api-keys:
    post:
      operationId: issueTenantRecoveryKey
      tags: [Admin]
      summary: Issue a recovery API key for an existing tenant
      security:
        - platformToken: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '201':
          description: Recovery API key created and returned once
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApiKeyCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/tenants/{tenantId}/users:
    post:
      operationId: createPlatformUser
      tags: [Admin]
      summary: Create a tenant user with any role
      security:
        - platformToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/tenants/{tenantId}/users/{userId}/password:
    post:
      operationId: resetPlatformUserPassword
      tags: [Admin]
      summary: Reset any tenant user password and revoke its sessions
      security:
        - platformToken: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AdminUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Create a browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created. The response sets an HttpOnly session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cross-origin login or disabled account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The request host is not linked to any tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/session:
    get:
      operationId: getBrowserSession
      tags: [Auth]
      summary: Get the current browser session and CSRF token
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke the current browser session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/password:
    post:
      operationId: changePassword
      tags: [Auth]
      summary: Change the current user password
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed and other sessions revoked
        '400':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users:
    get:
      operationId: listTenantUsers
      tags: [Users]
      summary: List tenant users
      responses:
        '200':
          description: Tenant users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createTenantUser
      tags: [Users]
      summary: Create an editor or viewer
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/users/{id}:
    patch:
      operationId: updateTenantUser
      tags: [Users]
      summary: Change a member role or status
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/users/{id}/password:
    post:
      operationId: resetTenantUserPassword
      tags: [Users]
      summary: Reset a member password and revoke their sessions
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me:
    get:
      operationId: getCurrentTenant
      tags: [Account]
      summary: Get the authenticated tenant, actor, and permissions
      responses:
        '200':
          description: Current tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tenant:
                        $ref: '#/components/schemas/Tenant'
                      permissions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Permission'
                      actor:
                        oneOf:
                          - type: object
                            required: [type]
                            properties:
                              type:
                                type: string
                                const: user
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                              email:
                                type: string
                                format: email
                              role:
                                $ref: '#/components/schemas/UserRole'
                          - type: object
                            required: [type]
                            properties:
                              type:
                                type: string
                                const: api_key
                              id:
                                type: string
                                format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/links:
    get:
      operationId: listLinks
      tags: [Links]
      summary: List short links
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/LinkStatus'
        - name: q
          in: query
          description: Search code, title, or target URL.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Short link page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Link'
                  pagination:
                    type: object
                    properties:
                      hasMore:
                        type: boolean
                      nextCursor:
                        type: [string, 'null']
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createLink
      tags: [Links]
      summary: Create a short link
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUrl]
              properties:
                targetUrl:
                  type: string
                  format: uri
                  maxLength: 2048
                code:
                  type: string
                  pattern: ^[a-z0-9](?:[a-z0-9_-]*[a-z0-9])?$
                  minLength: 3
                  maxLength: 64
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 1000
                tags:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    maxLength: 32
                expiresAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Short link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Link'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getLink
      tags: [Links]
      summary: Get a short link
      responses:
        '200':
          description: Short link
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Link'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateLink
      tags: [Links]
      summary: Update a short link
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                targetUrl:
                  type: string
                  format: uri
                  maxLength: 2048
                title:
                  type: [string, 'null']
                  maxLength: 200
                description:
                  type: [string, 'null']
                  maxLength: 1000
                tags:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    maxLength: 32
                status:
                  $ref: '#/components/schemas/LinkStatus'
                expiresAt:
                  type: [string, 'null']
                  format: date-time
      responses:
        '200':
          description: Updated short link
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Link'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteLink
      tags: [Links]
      summary: Delete a short link
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/api-keys:
    get:
      operationId: listApiKeys
      tags: [API Keys]
      summary: List API keys for the current tenant
      responses:
        '200':
          description: API key metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKeyMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createApiKey
      tags: [API Keys]
      summary: Create an API key
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApiKeyCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [API Keys]
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Revoked or already revoked
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot revoke the last active key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/analytics:
    get:
      operationId: queryAnalytics
      tags: [Analytics]
      summary: Query click analytics
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: linkId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Analytics result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Analytics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: Analytics Engine unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/ai/suggest:
    post:
      operationId: suggestLinkMetadata
      tags: [AI]
      summary: Suggest link metadata and short codes
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: AI or deterministic fallback suggestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      title:
                        type: string
                      description:
                        type: string
                      tags:
                        type: array
                        items:
                          type: string
                      codes:
                        type: array
                        items:
                          type: string
                      source:
                        type: string
                        enum: [ai, fallback]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /{code}:
    get:
      operationId: resolveShortCode
      tags: [Public]
      summary: Resolve a short code
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 64
      responses:
        '302':
          description: Redirect to target URL with incoming query parameters appended
          headers:
            Location:
              schema:
                type: string
        '404':
          description: Unknown host or code
        '410':
          description: Link disabled or expired
  /healthz:
    get:
      operationId: healthCheck
      tags: [Public]
      summary: Health check
      security: []
      responses:
        '200':
          description: Worker is serving requests
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    tenantKey:
      type: http
      scheme: bearer
      description: Tenant API key returned by provisioning or key creation.
    sessionCookie:
      type: apiKey
      in: cookie
      name: links_session
      description: HttpOnly browser session created by POST /api/v1/auth/login.
    platformToken:
      type: http
      scheme: bearer
      description: Platform provisioning token from the BOOTSTRAP_TOKEN secret.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for state-changing requests authenticated by browser session.
      schema:
        type: string
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LinkStatus:
      type: string
      enum: [active, disabled]
    UserRole:
      type: string
      enum: [owner, editor, viewer]
    Permission:
      type: string
      enum:
        - links:read
        - links:write
        - analytics:read
        - ai:suggest
        - api_keys:manage
        - users:manage
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          type: string
          enum: [active, disabled]
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        current:
          type: boolean
    AuthSession:
      type: object
      required: [user, tenant, permissions, csrfToken]
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/User'
            - type: object
              properties:
                status:
                  type: string
                  enum: [active, disabled]
        tenant:
          $ref: '#/components/schemas/Tenant'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        csrfToken:
          type: string
        expiresAt:
          type: [string, 'null']
          format: date-time
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
